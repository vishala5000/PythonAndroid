      - name: 🛠️ Pre-install Android SDK Tools & Accept ALL Licenses
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          
          # 1. Clean up any partial/broken downloads from previous failed runs
          rm -rf $SDK_DIR
          mkdir -p $SDK_DIR
          
          # 2. Download stable command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          
          # 3. Create the EXACT directory structure Buildozer expects
          mkdir -p $SDK_DIR/cmdline-tools/latest/bin
          mkdir -p $SDK_DIR/tools/bin
          mkdir -p $SDK_DIR/licenses
          
          # 4. Install the real sdkmanager in the modern path
          cp -r /tmp/cmdline/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          
          # 5. THE TRICK: Create a wrapper script in the legacy path Buildozer checks for.
          # This tricks Buildozer into thinking the SDK is fully installed, 
          # preventing it from downloading a fresh SDK and overwriting our licenses.
          cat << 'EOF' > $SDK_DIR/tools/bin/sdkmanager
#!/bin/bash
exec /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"
EOF
          chmod +x $SDK_DIR/tools/bin/sdkmanager
          
          # 6. THE SILVER BULLET: Accept ALL licenses automatically
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true
          
          # 7. Pre-install required components (PINNED to 33.0.2 to avoid 37.0.0 license issues)
          # This also installs 'aidl', which Buildozer was failing to find in your previous logs.
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          
          echo "✅ Android SDK tools pre-installed and ALL licenses accepted."
