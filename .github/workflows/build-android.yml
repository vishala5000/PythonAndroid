name: 🚀 Ultra-Fast Android Builder (No Buildozer)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK (Native & Fast)
        uses: android-actions/setup-android@v3

      - name: 🛠️ Install Gradle (For Project Scaffolding)
        run: sudo apt-get install -y gradle

      - name: 🏗️ Generate Android Project & Wrap Python
        run: python scripts/generate_android_project.py

      - name: 🚀 Build APK with Gradle (Ultra Fast)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          arguments: assembleDebug
          build-root-directory: ./android_app

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultra-fast-android-app
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
