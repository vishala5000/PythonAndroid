name: 🚀 Buildozer Android Builder (Fixed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILDOZER_SPEC: buildozer.spec

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-pip \
            zip unzip openjdk-17-jdk autoconf libtool \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev wget

      - name: 🚀 Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv

      - name: 🗄️ Cache Buildozer & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.android
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: 🛡️ Pre-Accept Android SDK Licenses
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/licenses
          
          # Write known license hashes to bypass interactive prompts
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK_DIR/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_DIR/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_DIR/licenses/android-sdk-license
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> $SDK_DIR/licenses/android-sdk-license
          echo "✅ Licenses pre-accepted."

      - name: ⚙️ Generate buildozer.spec
        run: |
          if [ ! -f "$BUILDOZER_SPEC" ]; then buildozer init; fi
          python scripts/generate_spec.py

      - name: 🏗️ Build APK (The Ultimate Fix)
        run: |
          mkdir -p ~/.buildozer
          # Pipe 'yes' to automatically answer any remaining license prompts
          yes | buildozer android debug
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: "1"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-android-app
          path: bin/*.apk
          if-no-files-found: error
