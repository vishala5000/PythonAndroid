name: 🚀 Master Android Builder (Guaranteed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILDOZER_SPEC: buildozer.spec

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10 (Stable for Android)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-pip \
            zip unzip openjdk-17-jdk autoconf libtool \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev wget

      - name: 🚀 Install Buildozer & Cython (Pinned Versions for Stability)
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv

      - name: 🗄️ Cache Android SDK & Gradle (Speed Optimization)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.android
            .buildozer
          key: ${{ runner.os }}-android-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: 🛡️ PRE-FLIGHT CHECK (The Guarantee)
        run: |
          python scripts/pre_flight.py

      - name: 🪄 AUTO-WRAPPER (If no UI detected)
        run: |
          python scripts/auto_wrapper.py

      - name: ⚙️ Generate buildozer.spec
        run: |
          if [ ! -f "$BUILDOZER_SPEC" ]; then buildozer init; fi
          python scripts/generate_spec.py

      - name: 🛠️ Pre-install Android SDK Tools & Accept ALL Licenses
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools/latest/bin
          mkdir -p $SDK_DIR/licenses
          
          # Clean up any partial/broken downloads from previous failed runs
          rm -rf $SDK_DIR/cmdline-tools
          rm -rf $SDK_DIR/tools
          
          # Download stable command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          
          # THE SILVER BULLET: Accept ALL licenses automatically (bypasses the y/N prompt completely)
          # This writes the license hashes for ALL versions (including 37.0.0) to the licenses folder
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true
          
          # Pre-install required components to speed up build and ensure stability
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          
          echo "✅ Android SDK tools pre-installed and ALL licenses accepted."

      - name: 🏗️ Build APK
        run: |
          mkdir -p ~/.buildozer
          buildozer android debug
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: "1"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          path: bin/*.apk
