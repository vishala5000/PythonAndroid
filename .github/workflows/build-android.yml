name: 🚀 Ultra-Fast Android Builder (No Buildozer)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Use Native Pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "✅ Native Android SDK configured."

      - name: 🏗️ Generate Android Project & Wrap Python
        run: python scripts/generate_android_project.py

      - name: 🚀 Build APK with Gradle (Ultra Fast)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          arguments: assembleDebug
          build-root-directory: ./android_app

      - name: 🔑 Auto-Sign APK (No Secrets Required)
        run: |
          # 1. Ensure the default debug keystore exists
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 2. Find the apksigner tool dynamically
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | head -n 1)
          
          # 3. Sign the APK using the default public debug credentials
          $APKSIGNER sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out android_app/app/build/outputs/apk/debug/app-signed.apk \
            android_app/app/build/outputs/apk/debug/app-debug.apk
            
          echo "✅ APK successfully signed with the default debug key!"

      - name: 📤 Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: my-python-android-app
          path: android_app/app/build/outputs/apk/debug/app-signed.apk
          if-no-files-found: error
